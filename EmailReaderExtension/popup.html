<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Reader</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h1>📧 Email Reader</h1>
        
        <div class="section">
            <button id="extractBtn" class="btn btn-primary">
                Extract Email Data
            </button>
        </div>

        <div class="section">
            <label for="chunkSize">Chunk Size (characters):</label>
            <input type="number" id="chunkSize" value="1000" min="100" max="10000">
        </div>

        <div id="status" class="status"></div>

        <div class="section">
            <h3>Export Options:</h3>
            <button id="downloadJson" class="btn btn-secondary" disabled>
                Download JSON
            </button>
            <button id="copyJson" class="btn btn-secondary" disabled>
                Copy to Clipboard
            </button>
            <button id="sendToBackend" class="btn btn-secondary" disabled>
                Send to Backend
            </button>
        </div>

        <div class="section">
            <label for="backendUrl">Backend URL (optional):</label>
            <input type="text" id="backendUrl" placeholder="http://localhost:3000/api/emails">
            <small style="color: #666; font-size: 12px; display: block; margin-top: 4px;">
                Leave empty to use smart label suggestions
            </small>
        </div>

        <div id="preview" class="preview"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
